; Arduino Uno — Bottle Wi-Fi Vendo controller
; IR object trigger + accept/reject servos, driven by the Orange Pi Zero 3
; over the primary USB serial @ 115200 (protocol in src/main.cpp).
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor -b 115200   (you can type PING / ACCEPT / REJECT /
;          RESET / TRIGGER / STATUS to test by hand)
;          ACCEPT/REJECT are only valid after TRIGGER (state WaitingForAi) and
;          must arrive within AI_RESPONSE_TIMEOUT_MS; use TESTACCEPT/TESTREJECT
;          to drive the servos directly from any state.

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps = arduino-libraries/Servo
